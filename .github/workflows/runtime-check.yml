name: Action runtime verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, node24
        with:
          python-version: '3.12'
      - name: Verify Python and regression tests
        run: |
          python --version
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest discover -s tests -v
      - name: Install pinned mihomo for real IPv6 node smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --retry 3 --max-time 180 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz \
            -o "$RUNNER_TEMP/bin/mihomo.gz"
          echo "60de76a35a6cbf7b4fa4a20f5c257c24345d1d635ab1aa3877022a1997ef413c  $RUNNER_TEMP/bin/mihomo.gz" | sha256sum --check --status
          gzip -dc "$RUNNER_TEMP/bin/mihomo.gz" > "$RUNNER_TEMP/bin/mihomo"
          chmod 700 "$RUNNER_TEMP/bin/mihomo"
      - name: Establish and verify IPv6 on this runner
        run: bash scripts/setup_runner_ipv6.sh
      - name: Verify real IPv6 entry nodes without publication
        env:
          SUBSTORE_BASE: ${{ secrets.SUBSTORE_BASE }}
          SOURCE_SECRETS_JSON: ${{ secrets.SOURCE_SECRETS_JSON }}
          MIHOMO_BIN: ${{ runner.temp }}/bin/mihomo
        run: |
          set -euo pipefail
          umask 077
          python tools/verify_runner_ipv6.py
      - name: Disconnect disposable WARP session
        if: always()
        run: |
          if command -v warp-cli >/dev/null 2>&1; then
            sudo warp-cli --accept-tos disconnect >/dev/null 2>&1 || true
          fi

name: Action runtime verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, node24
        with:
          python-version: '3.12'
      - name: Verify Python and regression tests
        run: |
          python --version
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest discover -s tests -v

name: All subscription probes
on:
  workflow_dispatch:
    inputs:
      sources_json:
        description: 'Optional JSON array of source names; empty means all original sources'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: all-subscription-probes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, node24
        with:
          python-version: '3.12'
      - name: Install dependency and run unit tests
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest discover -s tests -v
      - name: Report host IPv6 capability
        run: |
          set -euo pipefail
          # The runner's IPv6 reachability decides whether a v6-bound node can
          # be judged at all. Record the verdict instead of assuming it: an
          # unreachable node must never be published as dead.
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from actions_probe_all import host_ipv6_capable
          print('host_ipv6_capable=' + json.dumps(host_ipv6_capable()))
          PY
          ip -6 addr show scope global || true
          ip -6 route show default || true
      - name: Install pinned kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz \
            -o "$RUNNER_TEMP/bin/mihomo.gz"
          echo "60de76a35a6cbf7b4fa4a20f5c257c24345d1d635ab1aa3877022a1997ef413c  $RUNNER_TEMP/bin/mihomo.gz" | sha256sum --check --status
          gzip -dc "$RUNNER_TEMP/bin/mihomo.gz" > "$RUNNER_TEMP/bin/mihomo"
          chmod 700 "$RUNNER_TEMP/bin/mihomo"
          "$RUNNER_TEMP/bin/mihomo" -v
      - name: Fetch local ASN database
        shell: bash
        run: |
          set -euo pipefail
          # DB-IP ASN lite (CC-BY): plain CSV, IPv4 + IPv6, no API key, no rate
          # limit. This is the offline ASN layer; a blocked DoH endpoint or a
          # throttled ip-api must not cost us the ASN segment of every name.
          month="$(date -u +%Y-%m)"
          url="https://download.db-ip.com/free/dbip-asn-lite-${month}.csv.gz"
          mkdir -p "$RUNNER_TEMP/asndb"
          if ! curl --fail --silent --show-error --location --retry 3 --max-time 300 \
                 "$url" -o "$RUNNER_TEMP/asndb/asn.csv.gz"; then
            prev="$(date -u -d '1 month ago' +%Y-%m)"
            curl --fail --silent --show-error --location --retry 3 --max-time 300 \
              "https://download.db-ip.com/free/dbip-asn-lite-${prev}.csv.gz" \
              -o "$RUNNER_TEMP/asndb/asn.csv.gz"
          fi
          # Sanity: the dump is a headerless "start,end,asn,org" CSV. Reject an
          # HTML error page or a truncated download before it poisons ASN naming.
          # Decompress to a regular file first: `gzip -dc | head` makes gzip die
          # on SIGPIPE, which fails the step under `set -o pipefail`.
          gzip -dc "$RUNNER_TEMP/asndb/asn.csv.gz" > "$RUNNER_TEMP/asndb/asn.csv"
          head -n 2 "$RUNNER_TEMP/asndb/asn.csv"
          test "$(head -n 1 "$RUNNER_TEMP/asndb/asn.csv" | awk -F, '{print NF}')" -ge 4
          # Feed the plain CSV to the resolver (also avoids re-gzip on each run).
          echo "PROBE_ASN_CSV=$RUNNER_TEMP/asndb/asn.csv" >> "$GITHUB_ENV"
      - name: Verify Gist read access before spending measurement time
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          token = os.environ['GIST_TOKEN'].strip()
          gist_id = os.environ['GIST_ID'].strip()
          request = urllib.request.Request('https://api.github.com/gists/' + gist_id, headers={'Authorization': 'Bearer ' + token, 'User-Agent': 'probe-preflight', 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              assert data.get('public') is False
              print('gist_read_ok=true')
          except urllib.error.HTTPError as exc:
              print('gist_preflight_http=' + str(exc.code))
              raise SystemExit(2)
          except Exception as exc:
              print('gist_preflight_error=' + type(exc).__name__)
              raise SystemExit(2)
          PY
      - name: Materialize the IPv6 helper credentials
        shell: bash
        env:
          V6_HELPER_KEY: ${{ secrets.V6_HELPER_KEY }}
          V6_HELPER_KNOWN_HOSTS: ${{ secrets.V6_HELPER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$V6_HELPER_KEY"
          test -n "$V6_HELPER_KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/v6"
          printf '%s\n' "$V6_HELPER_KEY" > "$RUNNER_TEMP/v6/id_ed25519"
          chmod 600 "$RUNNER_TEMP/v6/id_ed25519"
          printf '%s\n' "$V6_HELPER_KNOWN_HOSTS" > "$RUNNER_TEMP/v6/known_hosts"
          chmod 600 "$RUNNER_TEMP/v6/known_hosts"
          echo "PROBE_V6_SSH_KEY=$RUNNER_TEMP/v6/id_ed25519" >> "$GITHUB_ENV"
          echo "PROBE_V6_SSH_KNOWN_HOSTS=$RUNNER_TEMP/v6/known_hosts" >> "$GITHUB_ENV"
      - name: Measure all original sources and publish Gist
        env:
          SUBSTORE_BASE: ${{ secrets.SUBSTORE_BASE }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # Gist id 也是定位器：secret gist 只要拿到 URL 就能匿名读全文，
          # 所以它和 token 一样只从 secret 注入，绝不写在仓库里。
          GIST_ID: ${{ secrets.GIST_ID }}
          # 新增需要独立凭据的订阅源时的预留位（详见 docs/ADDING_SOURCES.md）：
          # 一个 secret 装下所有「源名 -> 凭据」的 JSON map，以后加源只改这个
          # secret 的值，workflow 和代码都不用动。未设置时为空串=无行为变化。
          SOURCE_SECRETS_JSON: ${{ secrets.SOURCE_SECRETS_JSON }}
          MIHOMO_BIN: ${{ runner.temp }}/bin/mihomo
          PROBE_OUTPUT_DIR: ${{ runner.temp }}/probe-output
          # Tracing is I/O bound (one short curl per node against one shared
          # kernel), so the ceiling is the kernel/fd budget, not CPU. 24 left
          # the 4-core runner idle: a 1355-node round spent 441s, ~96% of it
          # dead nodes waiting out a timeout. Each node now gets a short first
          # pass and only failures pay the full PROBE_TIMEOUT in a second pass.
          PROBE_CONCURRENCY: '64'
          PROBE_GEO_LOOKUP: '1'
          # One shared kernel for the whole round (38 starts -> 1). A merged
          # group that fails is retried one kernel per source, so a bad config
          # cannot lose the round. PROBE_KERNEL_BATCH>0 caps sources per kernel.
          PROBE_KERNEL_BATCH: '0'
          # OPTIONAL prefilter, default OFF. The kernel /proxies/<name>/delay
          # endpoint can reject a dead node before curl, but a budget strict
          # enough to be safe (retry at the same 15s as curl's final pass) cost
          # ~40s more than it saved once kernels were merged: 121.4s vs 81.7s
          # measure. Latency is collected from curl's %{time_total} instead.
          # Enable only for experiments (PROBE_DELAY_PREFILTER=1).
          PROBE_DELAY_PREFILTER: '0'
          PROBE_DELAY_TIMEOUT_MS: '3000'
          # A first-budget miss is retried at the SAME 15s budget as curl's final
          # pass: the prefilter must never be stricter than the measurement it
          # replaces, or the slow-but-alive tail is silently dropped.
          PROBE_DELAY_RETRY_MS: '15000'
          # Identical connection definitions inside one source share one dial;
          # the verdict is replicated to every duplicate label.
          PROBE_DEDUPE: '1'
          PROBE_SOURCES_JSON: ${{ inputs.sources_json }}
          # IPv6-bound nodes cannot be dialled from an IPv4-only runner. The
          # helper is a host with a real global IPv6 route; it settles exactly
          # those nodes over one SSH session and returns verdicts. The runner
          # stays the only writer of the Gist.
          PROBE_V6_HELPER: ${{ secrets.V6_HELPER_HOST }}
          PROBE_V6_SSH_PORT: ${{ secrets.V6_HELPER_PORT }}
          PROBE_V6_SSH_USER: ${{ secrets.V6_HELPER_USER }}
          PROBE_V6_MIHOMO: /opt/probe-v6/bin/mihomo
          # The helper now measures all v6 roots through one kernel, so the
          # dial pool is the limit rather than 38 kernel starts.
          PROBE_V6_WORKERS: '48'
        run: |
          set -euo pipefail
          umask 077
          # One fd per in-flight dial plus the kernel's listeners. The raised
          # concurrency is I/O bound, so the fd ceiling is the real limit.
          ulimit -n 65536 || true
          test -n "$SUBSTORE_BASE"
          test -n "$GIST_TOKEN"
          python scripts/actions_probe_all.py
      - name: Audit published artifacts for naming and dedup defects
        env:
          PROBE_OUTPUT_DIR: ${{ runner.temp }}/probe-output
        run: |
          set -euo pipefail
          # The runner already holds this round's published files. Auditing the
          # local copy avoids extra GitHub API calls and rate limits.
          # --summary-only: 只输出汇总数字，不含节点名/源名明细——
          # 公开仓库的 step summary 人人可读，节点名会带出源与出口信息。
          python scripts/audit_artifacts.py --dir "$PROBE_OUTPUT_DIR" \
            --summary-only --report "$RUNNER_TEMP/artifact-audit.txt"
          {
            echo '## Artifact audit'
            echo '```'
            cat "$RUNNER_TEMP/artifact-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Subscription/config bodies contain credentials. Never upload them as
      # Actions artifacts or caches; ephemeral runner storage is destroyed.
